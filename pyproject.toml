[project]
name = "docstorage"
version = "0.0.2"
description = "A local, fully-managed file storage CLI app"
authors = [
    { name = "Michael Kornilich", email = "molego16@gmail.com" }
]
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "tabulate (>=0.10.0,<0.11.0)",
    "platformdirs (>=4.12.2,<5.0.0)"
]

[project.urls]
Repository = "https://github.com/Michael-Kornilich/docstorage"
Documentation = "https://github.com/Michael-Kornilich/docstorage/tree/main/docs"
Issues = "https://github.com/Michael-Kornilich/docstorage/issues"

[project.scripts]
docstorage = "docstorage.main:main"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
]

[tool.poetry]
packages = [
    { include = "docstorage", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
