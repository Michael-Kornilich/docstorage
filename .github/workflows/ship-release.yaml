name: Build and ship a release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        type: choice
        options: [ patch, minor, major ]
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # There may be a mismatch with the actual project
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run python -m pytest

      - name: Read current PyPI version
        id: pypi
        run: |
          python -m pip install packaging
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from urllib.request import urlopen
          try:
              with urlopen(f"https://pypi.org/pypi/docstorage/json") as response:
                version = json.load(response)["info"]["version"]
          except Exception as err:
              # Exception should occur if the package has not been shipped yet
              version = "0.0.0"
          print(f"version={version}")
          PY

      - name: Bump version
        id: bump
        run: |
          poetry version "${{ inputs.release_type }}"
          VERSION="$(poetry version --short)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure version is newer than PyPI
        env:
          CURRENT: ${{ steps.pypi.outputs.version }}
          NEXT: ${{ steps.bump.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from packaging.version import Version

          current, next_ = Version(os.environ["CURRENT"]), Version(os.environ["NEXT"])
          if next_ <= current:
              raise SystemExit(f"Refusing release: {next_} is not newer than {current}")
          print(f"Version check passed: {current} -> {next_}")
          PY

      - name: Build wheel
        run: poetry build --format wheel

      - name: Commit version and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Tag release $VERSION"
          git tag "release-$VERSION"
          git push origin HEAD
          git push origin "release-$VERSION"

      - name: Publish to PyPI
        run: poetry publish --username __token__ --password ${{ secrets.PYPI_TOKEN }}
